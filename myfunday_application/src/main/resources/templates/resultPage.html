<!Doctype html>
	<html>
		<head>
			<title>Result</title>
			<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
				rel="stylesheet" 
				integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
				crossorigin="anonymous">
			<link rel = "stylesheet" type = "text/css" href = "styles.css">
		</head>
		<body>
			<header>
				<h1>MyFunDay</h1>
				<a href="about_us" class="btn btn-primary aboutUs">О нас</a>
			</header>

			<div class = "container routes">
				<div class="carousel slide" id="route">
				<div class="carousel-indicators">
					<button type="button" data-bs-target="#route" data-bs-slide-to="0" class="active" aria-current="true" aria-label='Парк "Швейцария"'></button>
					<button type="button" data-bs-target="#route" data-bs-slide-to="1" aria-label="Фуку Рамен"></button>
					<button type="button" data-bs-target="#route" data-bs-slide-to="2" aria-label="Olymp Karting"></button>
				</div>
				<div class="carousel-inner">
					<div th:each="routes, stat : ${routes}" class="carousel-item" th:classappend="${stat.first} ? ' active'">
						<img src="img/Switzerland.jpg" class="d-block w-100" alt='Парк "Швейцария"'>

						<div class="container places my-5">
							<div class="card" th:each="place : ${routes}">
								<img th:src="@{img_db/{name}(name=${place.img})}" class="card-img-top" alt="Место 1">
								<div class="card-body d-flex flex-column">
									<h5 class="card-title" th:text="${place.name}">Место 1</h5>
									<p class="card-text" text style = "color: black" th:text="${place.description}">Описание места 1</p>
									<a href="#" class="btn btn-primary mt-auto">Подробнее</a>
								</div>
							</div>
						</div>
					</div>
				</div>
				<button class="carousel-control-prev" type="button" data-bs-target="#route" data-bs-slide="prev">
					<span class="carousel-control-prev-icon" aria-hidden="true"></span>
					<span class="visually-hidden">Предыдущий</span>
				</button>
				<button class="carousel-control-next" type="button" data-bs-target="#route" data-bs-slide="next">
					<span class="carousel-control-next-icon" aria-hidden="true"></span>
					<span class="visually-hidden">Следующий</span>
				</button>
			</div>


			<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
		</body>
	</html>
